<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teika — sign</title><meta name="robots" content="noindex">
<style>body{font-family:"Hiragino Mincho ProN",serif;background:#fff;color:#111;padding:32px 16px;max-width:560px;margin:auto;line-height:1.7}
pre{white-space:pre-wrap;font-size:13px;border:1px solid #ddd;padding:12px}button{font:inherit;font-size:17px;padding:12px 20px;border:1px solid #111;background:#111;color:#fff;width:100%}
#out{word-break:break-all;font:12px ui-monospace,Menlo,monospace;margin-top:16px}#msg{margin-top:12px;color:#b00}</style></head>
<body>
<p>MetaMask のアプリ内ブラウザで開き、下の文に署名する。ガス代はかからない（取引ではない）。</p>
<pre id="text">読み込み中…</pre>
<button id="b">署名する</button>
<div id="msg"></div>
<div id="out"></div>
<script>
const WALLET = "0x5b799eaa497fbb772e1b20ddcdb58351782cc0dc";
let text = "";
fetch("statement.txt", {cache: "no-store"}).then(r => r.text()).then(t => { text = t; document.getElementById("text").textContent = t; });
document.getElementById("b").onclick = async () => {
  const msg = document.getElementById("msg"), out = document.getElementById("out");
  msg.textContent = ""; out.textContent = "";
  if (!window.ethereum) { msg.textContent = "ウォレットが見つからない。MetaMask アプリのブラウザで開く。"; return; }
  try {
    const [acc] = await ethereum.request({method: "eth_requestAccounts"});
    if (acc.toLowerCase() !== WALLET) { msg.textContent = "定価のウォレットではない：" + acc; return; }
    const hex = "0x" + Array.from(new TextEncoder().encode(text), b => b.toString(16).padStart(2, "0")).join("");
    const sig = await ethereum.request({method: "personal_sign", params: [hex, acc]});
    out.textContent = sig;
    try { await navigator.clipboard.writeText(sig); msg.style.color = "#111"; msg.textContent = "署名をコピーした。チャットに貼る。"; } catch (e) { msg.style.color = "#111"; msg.textContent = "下の署名を長押しでコピーして、チャットに貼る。"; }
  } catch (e) { msg.textContent = "止まった：" + (e.message || e); }
};
</script>
</body></html>
